# Supabase pauses free projects after ~7 days without activity, which takes the
# website's chat widget offline. This runs a tiny read query every 3 days to keep
# the project awake. Row-level security means it returns no data.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zoxukadlhhoqcbzumehz.supabase.co/rest/v1/bookings?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
